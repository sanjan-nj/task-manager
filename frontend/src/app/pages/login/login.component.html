<div class="login-container">

  <div class="login-box">

    <h1>Task Manager</h1>
    <h2>Login</h2>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        >
      </div>

      <button type="submit">
        Login
      </button>

    </form>

    <p>
      Don't have an account?
      <a href="/register">Register</a>
    </p>

  </div>

</div>
