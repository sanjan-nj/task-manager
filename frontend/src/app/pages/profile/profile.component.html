<div class="profile-container">

  <div class="profile-card">

    <button
      class="back-btn"
      (click)="goToDashboard()"
    >
      ← Back to Dashboard
    </button>

    <div class="profile-avatar">
      {{ profileLetter }}
    </div>

    <h1>{{ name }}</h1>
    <p class="profile-email">{{ email }}</p>

    <div class="profile-info">

      <div class="info-item">
        <span>Name</span>
        <strong>{{ name }}</strong>
      </div>

      <div class="info-item">
        <span>Email</span>
        <strong>{{ email }}</strong>
      </div>

    </div>

    <button
      class="logout-btn"
      (click)="logout()"
    >
      Logout
    </button>

  </div>

</div>
